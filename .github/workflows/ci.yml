# Build and test on every Python this package promises to run on.
#
# Everything that does not need a broker runs on the whole matrix and takes
# seconds, because the fake transport is a dictionary. Anything that needs a
# broker is marked `integration` and runs in its own job against a service
# container, once — running it four times would learn the same thing four times.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # acemq-amqp can release without a commit landing here, and a range that has
  # stopped admitting the current release looks exactly like one that still does
  # until somebody checks. A timer is the only thing that looks.
  schedule:
    - cron: '11 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the library's floor and the one the type hints are written
        # against; the rest are what people actually run.
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        # The extra index is where acemq-amqp is published. This repository's
        # whole point is proving the published package works, so it is installed
        # from the index like anybody else's would be — never from a path.
        run: pip install -e ".[dev]" --extra-index-url https://acemq.org/pypi/simple/

      - name: Test
        # Not the integration tests: they need a broker, and they have a job.
        run: pytest -m "not integration" -q

      - name: Lint
        run: ruff check .

      - name: Types
        # Strict, and on the tests as well as the source: type hints that are
        # wrong are worse than none, because the wrong ones are believed.
        run: mypy

  integration:
    name: against a real broker
    runs-on: ubuntu-latest
    services:
      broker:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" --extra-index-url https://acemq.org/pypi/simple/

      - name: Find the broker container
        # The blocked-connection test has to raise a real memory alarm, which
        # takes rabbitmqctl: nothing on the client side can make a broker block a
        # connection. A service container's name is generated rather than chosen,
        # so it is looked up by image and handed over as the command that fronts
        # rabbitmqctl. Without this the test skips, and a test that never sees a
        # real block is how this class of defect survived in five libraries.
        run: |
          id="$(docker ps -q --filter ancestor=rabbitmq:4-alpine | head -1)"
          echo "ACEMQ_TEST_BROKER_CTL=docker exec $id rabbitmqctl" >> "$GITHUB_ENV"

      - name: Test against the broker
        env:
          ACEMQ_TEST_BROKER: amqp://guest:guest@localhost:5672/
        # -rs so a skipped integration test is visible in the log rather than a
        # dot that looks like a pass.
        run: pytest -m integration -q -rs

  tracks-the-release:
    name: the range still admits the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than a step in `test`, deliberately -- the same
    # argument the examples repositories make. A dependency that has fallen out of
    # step and a broken package are different findings and both are worth having:
    # everything above still installs, still tests and still type-checks whatever
    # this job concludes, so a red X here reads as "the declared dependency has
    # fallen behind the library", never as "we have no idea whether any of this
    # works".
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the version parser
        # packaging is what pip itself uses to decide whether a version satisfies
        # a specifier. Asking it is the difference between an answer that agrees
        # with pip and a shell string comparison guessing at whether "<0.8" covers
        # "0.8.0".
        run: pip install --quiet packaging

      - name: The declared range admits the newest release
        # A range is a different question from an exact pin, and forcing the two
        # into the same check would make this job wrong.
        #
        # An exact pin names one version, so it goes stale the instant a newer one
        # is released and equality is the whole question. This package does not
        # pin: it declares `acemq-amqp[rabbitmq]>=X,<Y`, which names a *set*, and a
        # set does not go stale because a release appeared. That is what the range
        # is for. Demanding that `<0.8` be rewritten on every 0.7.z release would
        # just be an exact pin with extra punctuation, and it would be a lie to
        # every application that installs this package, because the range is also
        # the constraint pip hands them.
        #
        # What a range *can* do is stop admitting the current release. `<0.8` is
        # correct through all of 0.7.z and becomes a wall the morning 0.8.0 ships.
        # Nothing here breaks at that moment, which is the danger: pip keeps
        # resolving 0.7.z, this workflow keeps passing, and it keeps proving
        # something about a version the feed no longer serves as current -- while
        # holding every downstream application back to it as well. So the
        # assertion is membership rather than equality: does the declared
        # specifier admit the newest release?
        #
        # Membership is also what makes the jobs above worth reading. pip installs
        # the newest version a range admits, so once the newest release is inside
        # the range, the test and integration jobs really are exercising it.
        #
        # Both sides are parsed rather than pattern-matched. The dependency is
        # found by canonical name in pyproject.toml, so reformatting the file or
        # changing the extras cannot make this check quietly stop finding it, and
        # the tags come from the library repository rather than the index because
        # git ls-remote needs no token on a scheduled run.
        run: |
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-python-amqp \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)

          # An empty answer means the listing failed or the tag naming changed,
          # and comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-python-amqp, so the range could not be checked"
            exit 1
          fi

          python3 - "$newest" <<'PY'
          import sys, tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          newest = Version(sys.argv[1])

          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["dependencies"]

          found = [r for r in map(Requirement, declared)
                   if canonicalize_name(r.name) == "acemq-amqp"]
          if not found:
              print("::error::pyproject.toml declares no dependency on acemq-amqp, "
                    "so the range could not be checked")
              sys.exit(1)

          requirement = found[0]
          if newest not in requirement.specifier:
              print(f"::error::pyproject.toml declares '{requirement}' but the newest "
                    f"acemq-amqp release is {newest}, which that range does not admit. "
                    f"Edit the acemq-amqp entry in [project] dependencies in "
                    f"pyproject.toml so its upper bound covers {newest} -- until then "
                    f"pip resolves an older release here and in every application that "
                    f"installs this package.")
              sys.exit(1)

          print(f"declared '{requirement}', which admits {newest}, the newest release")
          PY
