# Build the documentation site and publish it to GitHub Pages.
#
# The site is the prose under docs/ rendered to HTML, plus the API reference
# under /apidocs/, generated by pdoc from the docstrings in src/.
#
# The reference is part of the site rather than an afterthought. Python has
# nothing equivalent to pkg.go.dev building one from the source of every
# published version, so nothing else will host this. Generating it from the same
# commit as the prose is what stops the two drifting apart.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs-site.sh'
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it. In-progress runs are allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege for every job that does not ask for more. Jobs needing more
# declare it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install the package and pdoc
        # The package itself, because pdoc imports what it documents: without
        # fastapi and acemq_amqp installed, every module becomes a page saying
        # only that it could not be loaded.
        #
        # pdoc is pinned so a new release cannot change the rendered reference
        # without somebody choosing it.
        run: |
          pip install -e "." --extra-index-url https://acemq.org/pypi/simple/
          pip install pdoc==15.0.1

      - name: Render the pages
        # The script checks the source-side links first — the .md ones, which the
        # rendered check below cannot see because they have been rewritten to
        # .html by then. Both checks are needed and neither subsumes the other.
        run: bash .github/scripts/build-docs-site.sh

      - name: Check every link resolves
        # A published page linking to a 404 is a failure this family of sites has
        # already had once, and it went unnoticed because nothing checked. Cheap
        # to check, so it is checked.
        run: |
          python3 - <<'PY'
          import os, re, sys
          pages = [f for f in os.listdir("site") if f.endswith(".html")]
          broken = []
          for f in pages:
              for href in re.findall(r'href="([^"]+)"', open("site/" + f).read()):
                  if href.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target = href.split("#")[0]
                  if target and not os.path.exists(os.path.join("site", target)):
                      broken.append(f"{f} -> {href}")
          if broken:
              print("::error::the site links to pages that do not exist:")
              for b in broken:
                  print("  " + b)
              sys.exit(1)
          print(f"{len(pages)} pages, every internal link resolves")
          PY

      - name: Check the API reference covers the package
        # pdoc reports a module it cannot import as a page rather than as a
        # failure, so a missing dependency produces a reference that is present,
        # linked and empty. Counting the modules is what notices.
        run: |
          python3 - <<'PY'
          import os, sys
          expected = {
              "acemq_fastapi.html",
              "acemq_fastapi/dependencies.html",
              "acemq_fastapi/health.html",
              "acemq_fastapi/integration.html",
              "acemq_fastapi/lifespans.html",
              "acemq_fastapi/settings.html",
          }
          missing = [p for p in sorted(expected)
                     if not os.path.exists(os.path.join("site/apidocs", p))]
          if missing:
              print("::error::the API reference is missing pages:")
              for m in missing:
                  print("  " + m)
              sys.exit(1)
          print(f"the API reference has all {len(expected)} pages it must have")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A job's own block replaces the workflow default rather than adding to it,
    # so contents is repeated here. This is GitHub's own deploy-pages triple.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
